<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 4 Assignment: Password Validator</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f4f4f9; display: flex; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        
        .strength-container { margin: 0.5rem 0 1rem 0; }
        .strength-text { font-weight: bold; }
        .strength-bar { height: 6px; width: 100%; background: #e9ecef; border-radius: 3px; margin-top: 0.25rem; position: relative; }
        .strength-fill { height: 100%; width: 0%; border-radius: 3px; transition: width 0.3s, background-color 0.3s; }
        
        .checklist { list-style: none; padding: 0; margin: 0.5rem 0; font-size: 0.9rem; }
        .checklist li { margin-bottom: 0.25rem; color: #dc3545; }
        .checklist li.valid { color: #28a745; }
        
        .match-feedback { font-weight: 600; font-size: 0.95rem; margin-top: 0.5rem; }
        .text-danger { color: #dc3545; }
        .text-success { color: #28a745; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Create Account</h2>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password">
            
            <div class="strength-container">
                <span>Strength: <span id="strengthText" class="strength-text">Empty</span></span>
                <div class="strength-bar"><div id="strengthFill" class="strength-fill"></div></div>
            </div>

            <ul class="checklist">
                <li id="ruleLength">✖ At least 8 characters</li>
                <li id="ruleNumber">✖ Contains a number (0-9)</li>
                <li id="ruleSpecial">✖ Contains a special character (!@#$%^&*)</li>
            </ul>
        </div>
        
        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password">
            <div id="matchResult" class="match-feedback"></div>
        </div>
    </div>

    <script>
// Get the input elements
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");

// Add the same input event listener to both fields
passwordInput.addEventListener("input", updatePasswordValidation);
confirmPasswordInput.addEventListener("input", updatePasswordValidation);

function updatePasswordValidation() {
  const password = passwordInput.value;

  // Call the AI-generated function
  const results = checkPasswordRules(password);

  // Rule elements
  const ruleLength = document.getElementById("ruleLength");
  const ruleNumber = document.getElementById("ruleNumber");
  const ruleSpecial = document.getElementById("ruleSpecial");

  // Update minimum length rule
  if (results.hasMinLength) {
    ruleLength.classList.add("valid");
    ruleLength.textContent = "✓ At least 8 characters";
  } else {
    ruleLength.classList.remove("valid");
    ruleLength.textContent = "✖ At least 8 characters";
  }

  // Update number rule
  if (results.hasNumber) {
    ruleNumber.classList.add("valid");
    ruleNumber.textContent = "✓ Contains a number";
  } else {
    ruleNumber.classList.remove("valid");
    ruleNumber.textContent = "✖ Contains a number";
  }

  // Update special character rule
  if (results.hasSpecial) {
    ruleSpecial.classList.add("valid");
    ruleSpecial.textContent = "✓ Contains a special character (!@#$%^&*)";
  } else {
    ruleSpecial.classList.remove("valid");
    ruleSpecial.textContent = "✖ Contains a special character (!@#$%^&*)";
  }

  // Count how many rules passed
  let rulesPassed = 0;

  if (results.hasMinLength) {
    rulesPassed++;
  }

  if (results.hasNumber) {
    rulesPassed++;
  }

  if (results.hasSpecial) {
    rulesPassed++;
  }

  // Strength elements
  const strengthText = document.getElementById("strengthText");
  const strengthFill = document.getElementById("strengthFill");

  // Update overall strength
  if (password.length === 0) {
    strengthText.textContent = "Empty";
    strengthFill.style.width = "0%";
  } else if (rulesPassed <= 1) {
    strengthText.textContent = "Weak";
    strengthFill.style.width = "33%";
    strengthFill.style.backgroundColor = "#dc3545";
  } else if (rulesPassed === 2) {
    strengthText.textContent = "Medium";
    strengthFill.style.width = "66%";
    strengthFill.style.backgroundColor = "#ffc107";
  } else {
    strengthText.textContent = "Strong";
    strengthFill.style.width = "100%";
    strengthFill.style.backgroundColor = "#28a745";
  }
}


       function checkPasswordRules(passwordString) {
  let hasMinLength = false;
  let hasNumber = false;
  let hasSpecial = false;

  // Check minimum length
  if (passwordString.length >= 8) {
    hasMinLength = true;
  }

  // List of allowed special characters
  const specialCharacters = "!@#$%^&*";

  // Check each character in the password
  for (let i = 0; i < passwordString.length; i++) {
    const currentChar = passwordString[i];

    // Check for a number
    if (currentChar >= "0" && currentChar <= "9") {
      hasNumber = true;
    }

    // Check for a special character
    if (specialCharacters.includes(currentChar)) {
      hasSpecial = true;
    }

    // Stop early if all rules have been satisfied
    if (hasNumber && hasSpecial) {
      break;
    }
  }

  return {
    hasMinLength: hasMinLength,
    hasNumber: hasNumber,
    hasSpecial: hasSpecial
  };
}
    </script>
</body>
</html>
