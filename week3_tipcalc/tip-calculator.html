<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Assignment: Tip Calculator</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
            background: #f4f4f9;
        }

        .calculator {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 350px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: #218838;
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #e9ecef;
            border-radius: 4px;
        }

        .result-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .error {
            margin-top: 1rem;
            color: #b00020;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Tip Calculator</h2>

        <div class="form-group">
            <label for="billAmount">Bill Amount ($):</label>
            <input
                type="number"
                id="billAmount"
                placeholder="0.00"
                step="0.01"
            >
        </div>

        <div class="form-group">
            <label for="tipPercent">Tip Percentage (%):</label>
            <input
                type="number"
                id="tipPercent"
                placeholder="15"
                value="15"
            >
        </div>

        <button id="calcBtn">Calculate Total</button>

        <div id="errorResult" class="error"></div>

        <div class="result-box">
            <div class="result-line">
                <span>Tip Amount:</span>
                <span id="tipResult">$0.00</span>
            </div>

            <div class="result-line">
                <strong>Total Bill:</strong>
                <strong id="totalResult">$0.00</strong>
            </div>
        </div>
    </div>


    <script>
        function calculateBillTotals(bill, tipPercentage) {
            let error = null;

            if (typeof bill !== "number" || !Number.isFinite(bill)) {
                error = "Bill must be a valid number.";
            } else if (
                typeof tipPercentage !== "number" ||
                !Number.isFinite(tipPercentage)
            ) {
                error = "Tip percentage must be a valid number.";
            } else if (bill < 0 || bill > 10_000) {
                error = "Bill must be between 0 and 10,000.";
            } else if (tipPercentage < 0 || tipPercentage > 100) {
                error = "Tip percentage must be between 0 and 100.";
            }

            if (error) {
                return {
                    tipAmount: null,
                    grandTotal: null,
                    error: error
                };
            }

            const tipAmount = bill * tipPercentage / 100;
            const grandTotal = bill + tipAmount;

            return {
                tipAmount: Number(tipAmount.toFixed(2)),
                grandTotal: Number(grandTotal.toFixed(2)),
                error: null
            };
        }


        document.querySelector("#calcBtn").addEventListener("click", function () {

            // Input values are strings, so convert them to numbers.
            const bill = parseFloat(
                document.querySelector("#billAmount").value
            );

            const tipPercentage = parseFloat(
                document.querySelector("#tipPercent").value
            );

            // Call the calculation function.
            const result = calculateBillTotals(bill, tipPercentage);

            // Check for validation errors.
            if (result.error) {
                document.querySelector("#errorResult").textContent =
                    result.error;

                document.querySelector("#tipResult").textContent =
                    "$0.00";

                document.querySelector("#totalResult").textContent =
                    "$0.00";

                return;
            }

            // Clear any previous error.
            document.querySelector("#errorResult").textContent = "";

            // Display the calculated results.
            document.querySelector("#tipResult").textContent =
                "$" + result.tipAmount.toFixed(2);

            document.querySelector("#totalResult").textContent =
                "$" + result.grandTotal.toFixed(2);
        });
    </script>

</body>
</html>
