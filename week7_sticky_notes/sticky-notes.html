<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 7 Assignment: Persistent Sticky Notes</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #e0d4c3; padding: 2rem; }
        .dashboard { max-width: 900px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #b5a48f; padding-bottom: 1rem; margin-bottom: 2rem; }
        .control-panel { display: flex; gap: 0.5rem; background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        textarea { width: 250px; height: 60px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; resize: none; }
        button { background: #ffc107; color: #212529; border: none; padding: 0.5rem 1.25rem; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:hover { background: #e0a800; }
        
        /* Corkboard Grid layout */
        .corkboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
        
        /* Sticky Note Styling */
        .sticky-note { background: #fff799; padding: 1.2rem; min-height: 150px; box-shadow: 5px 5px 7px rgba(0,0,0,0.1); transform: rotate(-1deg); transition: transform 0.15s; display: flex; flex-direction: column; justify-content: space-between; border-radius: 2px; }
        .sticky-note:nth-child(even) { transform: rotate(1.5deg); background: #ffebad; }
        .sticky-note:nth-child(3n) { transform: rotate(-2deg); background: #e8ffad; }
        .sticky-note:hover { transform: scale(1.03) rotate(0deg); box-shadow: 8px 8px 12px rgba(0,0,0,0.15); z-index: 10; }
        
        .note-text { font-size: 1.05rem; color: #333; word-break: break-word; line-height: 1.4; }
        .note-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; font-size: 0.75rem; color: #777; }
        .delete-btn { background: none; border: none; color: #dc3545; cursor: pointer; font-weight: bold; font-size: 0.85rem; padding: 0; }
        .delete-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h2>📌 Corporate Corkboard Planner</h2>
            <div class="control-panel">
                <textarea id="noteInput" placeholder="Type a reminder note here..."></textarea>
                <button id="addNoteBtn">Pin Note</button>
            </div>
        </header>
        
        <!-- Render Target Area -->
        <div id="corkboardDisplay" class="corkboard">
            <!-- Dynamic sticky notes inject here -->
        </div>
    </div>

    <script>
        // GLOBAL APPLICATION STATE - Single source of truth
        let notesState = [];

        // DOM Elements
        const noteInput = document.getElementById("noteInput");
        const addNoteBtn = document.getElementById("addNoteBtn");
        const corkboardDisplay = document.getElementById("corkboardDisplay");

// Global state
//let notesState = [];

// Storage utility functions
function saveNotesToStorage(notesArray) {
  const notesJSON = JSON.stringify(notesArray);
  localStorage.setItem("boardNotesData", notesJSON);
}

function loadNotesFromStorage() {
  const savedNotes = localStorage.getItem("boardNotesData");

  if (savedNotes) {
    return JSON.parse(savedNotes);
  }

  return [];
}

// Render the notes on the corkboard
function renderBoard() {
  const corkboardDisplay = document.querySelector("#corkboardDisplay");

  corkboardDisplay.innerHTML = "";

  notesState.forEach(function (note) {
    const noteElement = document.createElement("div");

    noteElement.className = "note";
    noteElement.dataset.id = note.id;
    noteElement.textContent = note.content;

    corkboardDisplay.append(noteElement);
  });
}

// Add a new note
document.querySelector("#addNoteBtn").addEventListener("click", function () {
  const noteInput = document.querySelector("#noteInput");
  const valueText = noteInput.value.trim();

  if (valueText !== "") {
    const newNote = {
      id: Date.now(),
      content: valueText
    };

    notesState.push(newNote);

    saveNotesToStorage(notesState);
    renderBoard();

    noteInput.value = "";
  }
});

// Initialize the board with saved notes
notesState = loadNotesFromStorage();
renderBoard();

    </script>
</body>
</html>
